  <script>
    /* error log for #/dev and tests */
    window.__errors = [];
    addEventListener("error", function (e) { window.__errors.push(String(e.message)); });
    addEventListener("unhandledrejection", function (e) { window.__errors.push("rejection: " + String(e.reason)); });
    /* theme before first paint (no flash) */
    try {
      var s = JSON.parse(localStorage.getItem("gl.v1") || "null");
      var t = s && s.settings && s.settings.theme;
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
